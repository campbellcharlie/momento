<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>momento — local session history</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/themes.css" />
    <script>
      // Apply persisted theme before first paint so reloads don't flash the
      // default palette. Kept inline for minimum latency.
      try {
        var t = localStorage.getItem("momento.ui.theme");
        if (t) document.documentElement.dataset.theme = t;
        if (localStorage.getItem("momento.ui.liveHidden") === "1") {
          document.documentElement.dataset.liveHidden = "1";
        }
        var lh = parseInt(localStorage.getItem("momento.ui.liveHeight") || "", 10);
        if (Number.isFinite(lh) && lh >= 60) {
          document.documentElement.style.setProperty("--live-height", lh + "px");
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body class="dashboard">
    <header class="topbar" role="banner">
      <h1>momento</h1>
      <div class="topbar-scope">
        <span class="hint">scope:</span>
        <button type="button" class="chip" data-scope="14d" aria-pressed="true">14d</button>
        <button type="button" class="chip" data-scope="30d" aria-pressed="false">30d</button>
        <button type="button" class="chip" data-scope="90d" aria-pressed="false">90d</button>
        <button type="button" class="chip" data-scope="all" aria-pressed="false">all</button>
      </div>
      <div class="topbar-status" aria-live="polite">
        <button
          id="new-sessions-badge"
          class="topbar-new-badge"
          type="button"
          hidden
          aria-label="New sessions arrived since page load — click to refresh list"
        >+0 new</button>
        <label class="theme-picker" aria-label="Theme">
          <span class="hint">theme:</span>
          <select id="theme-select">
            <option value="">momento</option>
            <option value="dracula">dracula</option>
            <option value="gruvbox">gruvbox</option>
            <option value="nord">nord</option>
            <option value="monokai">monokai</option>
            <option value="solarized">solarized</option>
            <option value="catppuccin">catppuccin</option>
            <option value="rosepine">rosé pine</option>
            <option value="midnight">midnight</option>
            <option value="ember">ember</option>
            <option value="ayu-mirage">ayu mirage</option>
            <option value="ayu-light">ayu light</option>
            <option value="cyber">cyber</option>
          </select>
        </label>
        <button id="feed-pill" type="button" class="pill pill-muted" data-state="unknown" aria-pressed="true" title="Toggle live feed">feed: connecting…</button>
        <span id="uptime-pill" class="pill pill-muted">uptime: 0s</span>
        <span id="count-pill" class="pill pill-muted">sessions: 0</span>
      </div>
    </header>

    <section id="live-strip" class="live-strip" aria-label="Live activity feed">
      <header class="live-strip-header">
        <span class="hint">LIVE</span>
        <span id="live-strip-status" class="hint">idle</span>
        <button id="live-strip-clear" type="button" class="chip" title="Clear">clear</button>
      </header>
      <ol id="live-strip-feed" class="live-strip-feed" aria-live="polite"></ol>
      <div
        id="live-resize"
        class="resize-handle resize-handle-bottom"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize live feed"
        tabindex="0"
      ></div>
    </section>

    <main class="grid" role="main">
      <!-- Primary nav: time. Clicking a cell scopes everything below. -->
      <section class="panel panel-activity" aria-labelledby="panel-activity-h">
        <header class="panel-header">
          <h2 id="panel-activity-h">Activity</h2>
          <span id="activity-summary" class="hint"></span>
        </header>
        <div id="activity-canvas" class="panel-body">
          <p class="stub">[draft 1] activity heatmap goes here</p>
        </div>
      </section>

      <!-- Three-up: dimensions left → list right. -->
      <section class="panel panel-repos" aria-labelledby="panel-repos-h">
        <header class="panel-header">
          <h2 id="panel-repos-h">Repos</h2>
        </header>
        <div id="repos-canvas" class="panel-body">
          <p class="stub">[draft 1] repo lanes go here</p>
        </div>
      </section>

      <section class="panel panel-categories" aria-labelledby="panel-categories-h">
        <header class="panel-header">
          <h2 id="panel-categories-h">Categories</h2>
        </header>
        <div id="categories-canvas" class="panel-body">
          <p class="stub">[draft 1] category mix goes here</p>
        </div>
      </section>

      <section class="panel panel-sessions" aria-labelledby="panel-sessions-h">
        <header class="panel-header">
          <h2 id="panel-sessions-h">Sessions</h2>
          <span id="search-status" class="hint" role="status" aria-live="polite"></span>
        </header>
        <div class="panel-body">
          <!-- Search form preserved here so existing app.js DOM hooks survive
               draft 1. Drafts 5-6 will relocate the search affordance and
               wire it through the dashboard's scope state. -->
          <form id="search-form" class="search" role="search" autocomplete="off">
            <label for="search-input" class="visually-hidden">Search indexed sessions</label>
            <input
              id="search-input"
              type="search"
              name="q"
              placeholder="Search message content (FTS5; rare terms work best)…"
              spellcheck="false"
            />
            <div class="filters" role="group" aria-label="Filter by client">
              <button type="button" class="chip" data-client="" aria-pressed="true">all</button>
              <button type="button" class="chip" data-client="claude_code" aria-pressed="false">claude_code</button>
              <button type="button" class="chip" data-client="codex" aria-pressed="false">codex</button>
              <button type="button" class="chip" data-client="gemini" aria-pressed="false">gemini</button>
              <span class="chip-sep"></span>
              <button type="button" class="chip" id="recent-toggle" aria-pressed="true">recent</button>
            </div>
            <!-- Active scope summary: pills showing day/repo/category filters
                 applied by clicking the visualization panels. Each pill has
                 an × to clear that single dimension. Hidden when no filters
                 active. The category chip row that used to live here was
                 removed in draft 5 — Categories panel is the new source. -->
            <div id="scope-summary" class="scope-summary" hidden aria-label="Active scope"></div>
          </form>
          <ol id="search-results" class="result-list" aria-label="Search results"></ol>
        </div>
      </section>

      <section id="detail-panel" class="panel panel-detail detail" aria-live="polite" hidden>
        <div
          id="detail-resize"
          class="resize-handle"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Resize detail panel"
          tabindex="0"
        ></div>
        <header class="detail-header panel-header">
          <h2 id="detail-title"></h2>
          <button id="detail-close" type="button" aria-label="Close detail">×</button>
        </header>
        <p id="detail-meta" class="hint"></p>
        <div class="detail-tabs" role="tablist">
          <button type="button" class="tab" data-tab="messages" aria-pressed="true">messages</button>
          <button type="button" class="tab" data-tab="tools" aria-pressed="false">tools</button>
          <button type="button" class="tab" data-tab="files" aria-pressed="false">files</button>
        </div>
        <ul id="detail-list"></ul>
      </section>
    </main>

    <footer class="statusbar" role="contentinfo">
      <span id="db-path">db: —</span>
      <span class="muted">momento · 127.0.0.1 only · read-only</span>
    </footer>

    <!-- Live feed UI is collapsed into a future topbar badge (draft 6).
         These hidden hooks are preserved so app.js's existing SSE wiring
         doesn't error out during the draft transition. -->
    <div hidden>
      <button id="pause-btn" type="button" aria-pressed="false">Pause</button>
      <div id="feed-empty"></div>
      <ol id="feed"></ol>
    </div>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
